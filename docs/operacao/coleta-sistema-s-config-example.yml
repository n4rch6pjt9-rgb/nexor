# Exemplo de catálogo de fontes do Sistema S
# Exemplo declarativo para a implementação da spec 0069; ainda não é carregado pelo workflow.
# URLs e slugs abaixo correspondem às três fontes explicitamente discutidas.
# Não inclua aqui valores PF/PJ, consentimento, tokens ou qualquer secret.

versao: 1
fontes:
  - slug: sescdn
    nome: Sesc Departamento Nacional
    tecnologia: paradigma
    perfil: paradigma_egov_br
    base_url: https://egov-br.paradigmabs.com.br/sescdn/portal
    mural_url: https://egov-br.paradigmabs.com.br/sescdn/portal/Mural.aspx
    webservice_path: /WebService/Servicos.asmx
    coleta_oportunidades: true
    documentos:
      habilitados: true
      cadastro_visitante: oficial
      endereco_obrigatorio: null # preencher após confirmar no próprio formulário/fluxo do portal
      finalidade: armazenamento_e_embedding
    etapas:
      - descoberta
      - carga
      - documentos

  - slug: firjan
    nome: Firjan
    tecnologia: paradigma
    perfil: paradigma_firjan
    base_url: https://portaldecompras.firjan.com.br/portal
    mural_url: https://portaldecompras.firjan.com.br/portal/Mural.aspx
    webservice_path: /WebService/Servicos.asmx
    coleta_oportunidades: true
    documentos:
      habilitados: true
      cadastro_visitante: oficial
      endereco_obrigatorio: null # validar requisitos atuais do portal; não aplicar automaticamente às outras fontes
      finalidade: armazenamento_e_embedding
    etapas:
      - descoberta
      - carga
      - documentos

  - slug: sescsp
    nome: Sesc SP
    tecnologia: paradigma
    perfil: paradigma_scr360
    base_url: https://scr360.paradigmabs.com.br/sescsp/portal
    mural_url: https://scr360.paradigmabs.com.br/sescsp/portal/Mural.aspx
    webservice_path: /WebService/Servicos.asmx
    coleta_oportunidades: true
    documentos:
      habilitados: true
      cadastro_visitante: oficial
      endereco_obrigatorio: null # preencher após validação do fluxo deste portal
      finalidade: armazenamento_e_embedding
    etapas:
      - descoberta
      - carga
      - documentos

# Contrato de execução proposto:
# - `tecnologia` escolhe a família de protocolo; `perfil` seleciona diferenças de host/contrato comprovadas.
# - Os perfis não devem ser considerados três protocolos distintos até validação de paths/payloads/respostas.
# - `documentos.habilitados` não condiciona `coleta_oportunidades`.
# - Cadastro visitante lê os secrets/variables VISITANTE_* do ambiente de execução, nunca deste arquivo.
# - Sem cadastro válido, a oportunidade persiste; o documento fica pendente com motivo seguro para retry.
# - Arquivo armazenado é entrada do fluxo posterior de embeddings; falha de embedding não desfaz download/oportunidade.
# - Workflow deve continuar usando orçamentos/limites adequados e adicionar etapa documental sem exceder timeout do job.
